title: "Natacha Laure · Tarot Events"
tagline: "Animation tarot pour vos événements — Genève & arc lémanique"
description: >-
  Animation de tarot pour soirées d'entreprise, mariages et événements privés,
  de Genève à Lausanne. Consultations à distance et cours de Tarot de Marseille.
url: "https://tarot-events.ch"
baseurl: ""
lang: fr

# ───────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────
# PAIEMENT — colle ici l'adresse de ton lien de paiement Stripe.
# Tant que la ligne est vide, aucun bouton de paiement n'apparaît :
# le site dit simplement que tu reviens avec la marche à suivre.
# Pour créer le lien : dashboard.stripe.com → Liens de paiement →
# Nouveau → produit « Lecture écrite de tarot », 35 CHF, devise CHF →
# Créer → copier l'adresse (elle commence par https://buy.stripe.com/).
stripe_lecture_ecrite: "https://buy.stripe.com/eVqcN52Ml5XV8zM8FNfMA02"

# ─────────────────────────────────────────────────────────────────
# PRÉCOMMANDE DU JEU ANIMALIER
# Le bloc n'apparaît sur le site QUE si les trois lignes sont remplies.
# Tant qu'il en manque une, rien ne s'affiche : pas de demi-page en ligne.
#   deck_stripe      : second lien de paiement Stripe, à créer pour le jeu
#   deck_expedition  : ce que tu annonces aux acheteurs (ex. "janvier 2027")
#   deck_livraison   : frais de port (ex. "Frais de port offerts en Suisse")
deck_prix: 50
deck_stripe: ""
deck_expedition: ""
deck_livraison: ""
# ─────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────

# LA SEULE LIGNE À CHANGER TOI-MÊME
# Identifiant du 2e formulaire Formspree (la partie après /f/).
# Elle alimente les deux formulaires du site, dans les trois langues.
formspree_id: "xaeekdoz"
# ───────────────────────────────────────────────────────────────

contact:
  email: "natachalaure.voyance@gmail.com"
  zone: "de Genève à Lausanne"
  communes: "Genève, Nyon, Rolle, Morges, Lausanne et leurs environs"

tarifs:
  evenementiel_des: 650
  tenue_theme: 50
  ecrit: 35
  visio_30: 60
  visio_60: 100
  visio_90: 140
  duo_60: 140
  cours_90: 110
  cours_cycle: 380
  cours_journee: 190

langues:
  - code: fr
    nom: "Français"
    prefixe: ""
  - code: en
    nom: "English"
    prefixe: "/en"
  - code: de
    nom: "Deutsch"
    prefixe: "/de"

plugins:
  - jekyll-sitemap

collections:
  posts:
    output: true
    permalink: /blog/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "fr"
  - scope:
      path: ""
    values:
      sitemap: true

include:
  - CNAME

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .gitignore
  - "LISEZ-MOI*.md"
  - "A-LIRE*.md"

