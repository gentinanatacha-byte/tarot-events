# Les 22 arcanes majeurs du jeu fait maison de Natacha (deck animalier).
# `id` = le préfixe du fichier image dans /assets/cartes/ (00 → 21).
# Les noms français sont ceux de TON jeu, pas ceux de la tradition marseillaise :
# ton XIII s'appelle « La Mort » (le Marseille le laisse sans nom) et ton XVI
# « La Tour » (le Marseille dit « La Maison Dieu »). On garde les tiens.
#
# Aucune interprétation ici : le tirage révèle la carte et renvoie vers toi.

