# Les 22 arcanes majeurs du Tarot de Marseille.
# Seuls les NOMS figurent ici : aucune interprétation, aucun mot-clé.
# Le tirage de la page d'accueil se contente de révéler une carte et de
# renvoyer vers Auréa ou vers une consultation — c'est toi qui lis, pas le site.
#
# L'arcane XIII est traditionnellement sans nom dans le Tarot de Marseille :
# c'est volontaire, ce n'est pas un oubli.

